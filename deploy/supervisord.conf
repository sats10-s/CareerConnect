[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autorestart=true

[program:queue]
command=/usr/local/bin/php /var/www/html/backend/artisan queue:work --sleep=3 --tries=1 --timeout=900
directory=/var/www/html/backend
user=www-data
priority=30
autorestart=true
stopwaitsecs=900
